<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UAG Arc Raiders Hub standalone companion app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#020508">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UAG Arc Hub - Web">

  <link rel="apple-touch-icon" sizes="180x180" href="icons/uag-hub-apple-touch-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>UAG Arc Hub - Web</title>

  <style>
    :root {
      --uag-cyan: #10e7f3;
      --uag-magenta: #d52bd5;
      --uag-bg: #020508;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--uag-bg);
    }

    body {
      position: relative;
    }

    @supports (height: 100dvh) {
      html,
      body {
        height: 100dvh;
        min-height: 100dvh;
      }
    }

    flutter-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #uag-boot {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .10) 0%, rgba(0, 0, 0, .18) 46%, rgba(0, 0, 0, .88) 100%),
        radial-gradient(circle at 50% 32%, rgba(16, 231, 243, .16), transparent 48%),
        url("assets/assets/images/arc_raiders/hub/auth_bg_landscape.webp") center center / cover no-repeat,
        #020508;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      opacity: 1;
      transition: opacity 260ms ease;
    }

    #uag-boot::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .60) 0%, transparent 35%, transparent 68%, rgba(0, 0, 0, .44) 100%),
        linear-gradient(180deg, rgba(2, 5, 8, .08), rgba(2, 5, 8, .48));
    }

    #uag-boot.uag-boot-hide {
      opacity: 0;
      pointer-events: none;
    }

    .uag-boot-panel {
      position: relative;
      z-index: 1;
      width: min(86vw, 560px);
      padding: 34px 36px 30px;
      text-align: center;
      border: 1px solid rgba(16, 231, 243, .18);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(3, 13, 18, .36), rgba(2, 5, 8, .56));
      box-shadow:
        0 24px 80px rgba(0, 0, 0, .34),
        inset 0 0 40px rgba(16, 231, 243, .03);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .uag-boot-logo {
      display: block;
      width: 190px;
      height: 190px;
      margin: 0 auto 16px;
      object-fit: contain;
      filter:
        drop-shadow(0 0 12px rgba(16, 231, 243, .48))
        drop-shadow(0 0 24px rgba(213, 43, 213, .20));
    }

    .uag-boot-title {
      margin: 0;
      color: var(--uag-cyan);
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: .07em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(16, 231, 243, .22);
    }

    .uag-boot-status {
      margin-top: 28px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .92;
      animation: uag-status-pulse 1.45s ease-in-out infinite alternate;
    }

    .uag-loader-shell {
      position: relative;
      height: 8px;
      margin: 12px auto 0;
      overflow: hidden;
      border: 1px solid rgba(16, 231, 243, .28);
      border-radius: 999px;
      background: rgba(0, 0, 0, .56);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, .45);
    }

    .uag-loader-bar {
      position: absolute;
      inset: 0 auto 0 -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--uag-cyan) 0%, #55d9ff 46%, var(--uag-magenta) 100%);
      box-shadow:
        0 0 14px rgba(16, 231, 243, .66),
        0 0 22px rgba(213, 43, 213, .28);
      animation: uag-loader-scan 1.6s cubic-bezier(.55, .06, .48, .95) infinite;
    }

    .uag-loader-line {
      height: 1px;
      margin-top: 16px;
      background: linear-gradient(90deg, transparent, rgba(16, 231, 243, .42), rgba(213, 43, 213, .40), transparent);
    }

    @keyframes uag-loader-scan {
      0% { transform: translateX(0); }
      100% { transform: translateX(340%); }
    }

    @keyframes uag-status-pulse {
      from { opacity: .55; }
      to { opacity: 1; }
    }

    @media (max-width: 700px) {
      #uag-boot {
        background-position: 36% center;
      }

      .uag-boot-panel {
        width: min(82vw, 440px);
        padding: 28px 22px 24px;
      }

      .uag-boot-logo {
        width: 142px;
        height: 142px;
      }

      .uag-boot-status {
        margin-top: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .uag-loader-bar,
      .uag-boot-status {
        animation-duration: 4s;
      }
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    function removeUagBoot() {
      const boot = document.getElementById("uag-boot");
      if (!boot) return;
      boot.classList.add("uag-boot-hide");
      window.setTimeout(() => boot.remove(), 280);
    }
  </script>

  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2994575443987525"
    crossorigin="anonymous">
  </script>
</head>

<body>
  <div id="uag-boot" aria-label="Loading UAG ARC Raiders Hub">
    <div class="uag-boot-panel">
      <img class="uag-boot-logo" src="assets/assets/icon/uag_traders_icon_transparent.webp" alt="" aria-hidden="true">
      <h1 class="uag-boot-title">UAG ARC RAIDERS HUB</h1>
      <div class="uag-boot-status">Initialising systems</div>
      <div class="uag-loader-shell" aria-hidden="true">
        <div class="uag-loader-bar"></div>
      </div>
      <div class="uag-loader-line" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    window.addEventListener("flutter-first-frame", removeUagBoot, { once: true });

    window.setTimeout(function () {
      if (document.querySelector("flutter-view")) {
        removeUagBoot();
      }
    }, 12000);
  </script>

  <script src="uag_update_manager.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
