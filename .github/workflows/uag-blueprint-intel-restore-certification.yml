name: UAG Blueprint Add Intel Regression Certification

on:
  push:
    branches:
      - fix/blueprint-intel-entry-20261031
    paths:
      - .github/workflows/uag-blueprint-intel-restore-certification.yml
permissions:
  contents: read
  checks: write

jobs:
  certify-intel-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze complete Dart project
        run: flutter analyze --no-fatal-infos
      - name: Test Blueprint Intel and locked collection regressions
        run: |
          flutter test --reporter expanded \
            test/blueprint_intel_entry_restoration_test.dart \
            test/blueprint_grid_screen_regression_test.dart \
            test/arc_blueprint_canonical_grid_test.dart \
            test/arc_blueprint_drop_report_legacy_payload_test.dart \
            test/pass26_furniture_design_grid_order_test.dart \
            test/pass27_favourite_snapshot_relevance_regression_test.dart \
            test/arc_furniture_design_artwork_wiring_test.dart \
            test/arc_command_centre_loadout_restore_regression_test.dart
      - name: Build production web bundle
        run: flutter build web --release --no-wasm-dry-run
      - name: Build Sony Xperia debug APK
        run: flutter build apk --debug
      - name: Retain Sony test APK
        uses: actions/upload-artifact@v4
        with:
          name: uag-blueprint-intel-restore-sony-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      # No production deployment or Firestore write.
