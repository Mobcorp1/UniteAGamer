name: PASS 221 Release Certification

on:
  push:
    branches:
      - codex/full-arc-ui-convergence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify certification baseline and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "HEAD: $(git rev-parse HEAD)"
          git merge-base --is-ancestor 2933d975dcfec67fe5e6a33146aeb74ff92f8610 HEAD
          test -z "$(git status --porcelain)"

      - name: Set up Flutter 3.41.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format gate
        shell: bash
        run: |
          set -euo pipefail
          dart format .
          git diff -- lib/features/trading_hub/arc_raiders/screens/favourite_loadout_screen.dart
          test -z "$(git status --porcelain)"

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test --reporter expanded

      - name: Flutter web release build
        run: flutter build web --release --no-wasm-dry-run

      - name: Flutter Android debug APK build
        run: flutter build apk --debug

      - name: Validate Cloud Functions syntax
        run: node --check functions/index.js

      - name: Run complete Functions test suite
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for test_file in functions/tests/*.js; do
            echo "==> $test_file"
            node "$test_file" || status=1
          done
          exit "$status"

      - name: Validate Firestore rules and commercial authorization
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/pass221-firestore-rules"
          mkdir -p "$test_dir"
          cd "$test_dir"
          npm init -y >/dev/null
          npm install --silent @firebase/rules-unit-testing firebase
          cat > firestore_rules_test.cjs <<'NODE'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {
            initializeTestEnvironment,
            assertFails,
            assertSucceeds,
          } = require('@firebase/rules-unit-testing');
          const {
            doc,
            getDoc,
            setDoc,
            updateDoc,
          } = require('firebase/firestore');

          async function main() {
            const rules = fs.readFileSync(
              process.env.GITHUB_WORKSPACE + '/firestore.rules',
              'utf8',
            );
            const env = await initializeTestEnvironment({
              projectId: 'demo-uag',
              firestore: {rules},
            });

            try {
              await env.clearFirestore();

              await env.withSecurityRulesDisabled(async (context) => {
                await setDoc(doc(context.firestore(), 'users', 'normal-user'), {
                  displayName: 'Normal Raider',
                  isAdmin: false,
                  isDev: false,
                  isModerator: false,
                  subscriptionTier: 'free',
                  subscriptionStatus: 'free',
                });
                await setDoc(doc(context.firestore(), 'users', 'admin-user'), {
                  displayName: 'Admin Raider',
                  isAdmin: true,
                  isDev: false,
                  isModerator: false,
                  subscriptionTier: 'premium',
                  subscriptionStatus: 'active',
                });
                await setDoc(
                  doc(
                    context.firestore(),
                    'arc_admin_map_markers',
                    'pass221-marker',
                  ),
                  {
                    state: 'published',
                    provisionalVisible: false,
                    sourcePermission: 'permitted',
                    name: 'PASS 221 marker',
                  },
                );
              });

              const userDb = env
                .authenticatedContext('normal-user')
                .firestore();
              const userRef = doc(userDb, 'users', 'normal-user');

              await assertSucceeds(
                updateDoc(userRef, {displayName: 'Normal Raider Updated'}),
              );
              await assertFails(
                updateDoc(userRef, {subscriptionTier: 'premium'}),
              );
              await assertFails(
                updateDoc(userRef, {subscriptionStatus: 'active'}),
              );
              await assertFails(updateDoc(userRef, {foundingRaider: true}));
              await assertFails(updateDoc(userRef, {isAdmin: true}));

              const anonymousDb = env.unauthenticatedContext().firestore();
              await assertFails(
                updateDoc(
                  doc(anonymousDb, 'users', 'normal-user'),
                  {displayName: 'Spoofed'},
                ),
              );

              const markerRef = doc(
                userDb,
                'arc_admin_map_markers',
                'pass221-marker',
              );
              await assertSucceeds(getDoc(markerRef));
              await assertFails(
                updateDoc(markerRef, {name: 'Unauthorized edit'}),
              );

              const adminDb = env
                .authenticatedContext('admin-user')
                .firestore();
              await assertSucceeds(
                updateDoc(
                  doc(
                    adminDb,
                    'arc_admin_map_markers',
                    'pass221-marker',
                  ),
                  {name: 'Authorized admin edit'},
                ),
              );

              await env.withSecurityRulesDisabled(async (context) => {
                const backendRef = doc(
                  context.firestore(),
                  'users',
                  'normal-user',
                );
                await updateDoc(backendRef, {
                  subscriptionTier: 'premium',
                  subscriptionStatus: 'active',
                  foundingRaider: true,
                });
                const snapshot = await getDoc(backendRef);
                assert.equal(snapshot.data().subscriptionTier, 'premium');
                assert.equal(snapshot.data().subscriptionStatus, 'active');
                assert.equal(snapshot.data().foundingRaider, true);
              });

              console.log(
                'Firestore rules authorization: PASS — client spoofing rejected; legitimate user, admin, and backend writes accepted.',
              );
            } finally {
              await env.cleanup();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          cd "$GITHUB_WORKSPACE"
          npx --yes firebase-tools@15.30.2 emulators:exec --only firestore --project demo-uag "node '$test_dir/firestore_rules_test.cjs'"

      - name: Confirm certification run left source clean
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)"
