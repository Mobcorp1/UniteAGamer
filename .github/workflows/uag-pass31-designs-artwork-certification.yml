name: UAG PASS31 Designs Artwork Card Fit Certification

on:
  push:
    branches:
      - fix/pass31-designs-artwork-card-fit-20261031
    paths:
      - .github/workflows/uag-pass31-designs-artwork-certification.yml

permissions:
  contents: read

jobs:
  certify-pass31:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out full application
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze full Dart project
        run: flutter analyze --no-fatal-infos
      - name: Test PASS31 artwork, PASS30 layout and locked regressions
        run: |
          flutter test --reporter expanded \
            test/pass31_designs_artwork_fill_test.dart \
            test/pass30_designs_landscape_layout_test.dart \
            test/arc_collections_polish_pass08_test.dart \
            test/arc_collections_persistent_grid_test.dart \
            test/arc_collections_unified_ux_test.dart \
            test/pass26_furniture_design_grid_order_test.dart \
            test/arc_furniture_design_artwork_wiring_test.dart \
            test/blueprint_intel_entry_restoration_test.dart \
            test/blueprint_grid_screen_regression_test.dart \
            test/pass27_favourite_snapshot_relevance_regression_test.dart
      - name: Build release website without deploying
        run: flutter build web --release
      - name: Build Sony Android debug APK
        run: flutter build apk --debug
      - name: Retain Android APK
        uses: actions/upload-artifact@v4
        with:
          name: uag-pass31-designs-artwork-sony-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      # No production deployment from certification branch.
