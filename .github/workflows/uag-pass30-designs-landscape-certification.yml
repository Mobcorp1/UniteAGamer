name: UAG PASS30 Designs Landscape Certification

on:
  push:
    branches:
      - fix/pass30-designs-landscape-space-20261031
    paths:
      - .github/workflows/uag-pass30-designs-landscape-certification.yml

permissions:
  contents: read

jobs:
  certify-pass30:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze full app
        run: flutter analyze --no-fatal-infos
      - name: Certify Designs, Stencils, locked Blueprints and Favourite Loadout
        run: |
          flutter test --reporter expanded \
            test/pass30_designs_landscape_layout_test.dart \
            test/arc_collections_polish_pass08_test.dart \
            test/arc_collections_persistent_grid_test.dart \
            test/arc_collections_unified_ux_test.dart \
            test/pass26_furniture_design_grid_order_test.dart \
            test/arc_furniture_design_artwork_wiring_test.dart \
            test/blueprint_grid_screen_regression_test.dart \
            test/pass27_favourite_snapshot_relevance_regression_test.dart \
            test/blueprint_intel_entry_restoration_test.dart
      - name: Build production web artifact without deploying
        run: flutter build web --release
      - name: Build Sony Android debug APK
        run: flutter build apk --debug
      - name: Save Sony APK
        uses: actions/upload-artifact@v4
        with:
          name: pass30-designs-landscape-sony-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
