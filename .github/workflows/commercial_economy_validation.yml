name: Commercial Economy Validation

on:
  push:
    branches:
      - chatgpt/commercial-economy-lock
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout commercial branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Cloud Functions syntax
        run: node --check functions/index.js

      - name: Test commercial Cloud Functions policy
        run: node --test functions/tests/uag_commercial_economy_test.js

      - name: Check formatting of changed commercial Dart
        run: |
          dart format --output=none --set-exit-if-changed             lib/features/monetisation/models/uag_commercial_economy.dart             lib/features/monetisation/models/uag_raider_mark_policy.dart             lib/features/monetisation/models/uag_subscription_plan.dart             lib/features/monetisation/models/uag_plan_limits.dart             lib/features/monetisation/services/uag_entitlement_service.dart             lib/features/monetisation/services/uag_checkout_service.dart             lib/features/monetisation/screens/monetisation_screen.dart             lib/features/monetisation/screens/admin_monetisation_dashboard.dart             lib/features/monetisation/widgets/uag_beta_founder_offer_panel.dart             lib/features/monetisation/widgets/uag_beta_founder_admin_panel.dart             lib/features/monetisation/widgets/uag_commercial_offers_panel.dart             lib/features/monetisation/widgets/uag_commercial_campaign_admin_panel.dart             lib/features/monetisation/widgets/uag_creator_campaign_discount_admin_panel.dart             lib/features/monetisation/repositories/uag_creator_front_door_repository.dart             test/features/monetisation/uag_commercial_economy_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Commercial economy tests
        run: flutter test test/features/monetisation/uag_commercial_economy_test.dart --reporter expanded

      - name: Full Flutter tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run

      - name: Build Android debug APK
        run: flutter build apk --debug
