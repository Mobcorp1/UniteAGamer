name: UAG PASS32 Stencils Bottom Ad Layout Certification

on:
  push:
    branches:
      - fix/pass32-stencils-bottom-ad-layout-20261031
    paths:
      - .github/workflows/uag-pass32-stencils-layout-certification.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Certify Stencils dock and preserved collection regressions
        run: |
          flutter test --reporter expanded \
            test/pass32_stencils_bottom_ad_layout_test.dart \
            test/pass31_designs_artwork_fill_test.dart \
            test/pass30_designs_landscape_layout_test.dart \
            test/arc_collections_polish_pass08_test.dart \
            test/arc_collections_persistent_grid_test.dart \
            test/arc_collections_unified_ux_test.dart \
            test/pass26_furniture_design_grid_order_test.dart \
            test/arc_furniture_design_artwork_wiring_test.dart \
            test/blueprint_intel_entry_restoration_test.dart \
            test/blueprint_grid_screen_regression_test.dart \
            test/pass27_favourite_snapshot_relevance_regression_test.dart
      - name: Build web bundle without deployment
        run: flutter build web --release
      - name: Build Android Sony APK
        run: flutter build apk --debug
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: uag-pass32-stencil-dock-sony-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      # No Firebase deployment from certification branch.
