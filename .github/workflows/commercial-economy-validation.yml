name: Commercial Economy Validation

on:
  push:
    branches:
      - chatgpt/commercial-economy-lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/commercial-economy-lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloud Functions syntax
        run: node --check functions/index.js

      - name: Run commercial backend tests
        run: node --test functions/tests/uag_commercial_economy_test.js functions/tests/uag_commercial_checkout_contract_test.js

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format changed commercial Dart
        run: |
          dart format             lib/features/monetisation/models/uag_commercial_economy.dart             lib/features/monetisation/models/uag_raider_mark_policy.dart             lib/features/monetisation/models/uag_subscription_plan.dart             lib/features/monetisation/models/uag_plan_limits.dart             lib/features/monetisation/models/uag_beta_founder_pricing.dart             lib/features/monetisation/models/uag_creator_commercial_policy.dart             lib/features/monetisation/services/uag_entitlement_service.dart             lib/features/monetisation/services/uag_checkout_service.dart             lib/features/monetisation/repositories/uag_creator_front_door_repository.dart             lib/features/monetisation/screens/monetisation_screen.dart             lib/features/monetisation/screens/admin_monetisation_dashboard.dart             lib/features/monetisation/screens/uag_creator_programme_screen.dart             lib/features/monetisation/widgets/uag_beta_founder_offer_panel.dart             lib/features/monetisation/widgets/uag_beta_founder_admin_panel.dart             lib/features/monetisation/widgets/uag_commercial_offers_panel.dart             lib/features/monetisation/widgets/uag_commercial_campaign_admin_panel.dart             lib/features/monetisation/widgets/uag_creator_campaign_discount_admin_panel.dart             test/features/monetisation/uag_commercial_economy_test.dart

      - name: Commit formatting only
        run: |
          git checkout -- pubspec.lock analysis_options.yaml
          if ! git diff --quiet -- '*.dart'; then
            git config user.name "UAG Validation"
            git config user.email "actions@users.noreply.github.com"
            git add -- '*.dart'
            git commit -m "Format commercial economy changes"
            git push origin HEAD:chatgpt/commercial-economy-lock
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build web
        run: flutter build web --release --no-wasm-dry-run

      - name: Build Android debug APK
        run: flutter build apk --debug
